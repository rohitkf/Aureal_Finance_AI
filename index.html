<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aureal Finance AI — your financial command centre</title>
    <meta
      name="description"
      content="Aureal Finance AI is a personal financial operating system: balances, budgets, forecasting and a Safe-to-Spend figure calculated for you."
    />
    <meta name="theme-color" content="#051424" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aureal" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
  </head>
  <body>
    <script>
      // Applied before first paint. The signed-in preference lives in the
      // user's profile, but it is mirrored here so the sign-in screen and the
      // first frame after a reload are already the right theme.
      (function () {
        try {
          var stored = localStorage.getItem('aureal.theme');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#060709' : '#f2f3f5');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
