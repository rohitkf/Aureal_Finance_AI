server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted build output never changes under its own name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The worker controls the whole origin and must never be served stale, or a
    # bad build pins itself in place on every device that has it installed.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # The app uses BrowserRouter, so a deep link or a hard refresh has to
    # resolve to index.html and let the router take it from there. This is the
    # same rule vercel.json applies in production; without it /login and
    # /reset-password — where the confirmation and password-reset emails land —
    # return 404.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
